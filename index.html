<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ARMOPA - Administración Inmobiliaria. Compra, venta, alquiler, remodelación, construcción y desarrollo inmobiliario en Guatemala.">
<title>ARMOPA | Administración Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="styles.css?v=20260920c">
</head>
<body>

<header class="hdr">
  <div class="wrap nav">
    <a class="brand" href="#inicio" aria-label="ARMOPA Administración Inmobiliaria"><img src="assets/logo.webp" alt="ARMOPA Administración Inmobiliaria"></a>
    <button class="burger" type="button" id="burger" data-i18n-label="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div class="navwrap" id="navwrap">
      <nav class="links" data-i18n-label="menu">
        <a href="#inicio" data-i18n="nInicio"></a>
        <a href="#nosotros" data-i18n="nNosotros"></a>
        <a href="#propiedades" data-i18n="nPropiedades"></a>
        <a href="#servicios" data-i18n="nServicios"></a>
        <a href="#proyectos" data-i18n="nProyectos"></a>
        <a href="#contacto" data-i18n="nContacto"></a>
      </nav>
      <div class="tools">
        <button class="lg on" type="button" data-lang="es">ES</button>
        <button class="lg" type="button" data-lang="en">EN</button>
        <button class="btn btn-line" type="button" id="openClient" data-i18n="client"></button>
      </div>
    </div>
  </div>
</header>

<main id="inicio">
  <div class="hero" role="img" data-i18n-label="heroAlt"></div>

  <section class="stmt">
    <div class="wrap">
      <p class="tag" data-i18n="tag"></p>
      <div class="stmt-in">
        <div>
          <h1><span data-i18n="heroL1"></span><span class="g" data-i18n="heroL2"></span></h1>
          <p class="lede" data-i18n="lede"></p>
        </div>
        <div class="stmt-btns">
          <a class="btn btn-gold" href="#propiedades" data-i18n="btnProps"></a>
          <a class="btn btn-line" href="#servicios" data-i18n="btnServ"></a>
        </div>
      </div>
      <div class="trust">
        <div class="tr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg><div><strong data-i18n="t1"></strong><span data-i18n="t1s"></span></div></div>
        <div class="tr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8"></path><path d="M15 8h5v5"></path></svg><div><strong data-i18n="t2"></strong><span data-i18n="t2s"></span></div></div>
        <div class="tr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><div><strong data-i18n="t3"></strong><span data-i18n="t3s"></span></div></div>
        <div class="tr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg><div><strong data-i18n="t4"></strong><span data-i18n="t4s"></span></div></div>
      </div>
    </div>
  </section>

  <section class="sec about" id="nosotros">
    <div class="wrap about-in">
      <h2 data-i18n="aboutH"></h2>
      <p data-i18n="aboutP"></p>
    </div>
  </section>

  <section class="sec paper" id="propiedades">
    <div class="wrap">
      <div class="sec-h">
        <h2 data-i18n="propH"></h2>
        <a class="lnk" href="#contacto" data-i18n="catalog"></a>
      </div>
      <div class="car" id="car" style="--i:0">
        <button class="arr" type="button" id="prev" data-i18n-label="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <div class="car-vp"><div class="car-track">
        <article class="pc"><img src="assets/propiedad-1.jpg" alt=""><div class="pn"></div></article>
        <article class="pc"><img src="assets/propiedad-2.jpg" alt=""><div class="pn"></div></article>
        <article class="pc"><img src="assets/propiedad-3.jpg" alt=""><div class="pn"></div></article>
        <article class="pc"><img src="assets/propiedad-4.jpg" alt=""><div class="pn"></div></article>
        <article class="pc"><img src="assets/propiedad-5.jpg" alt=""><div class="pn"></div></article>
        </div></div>
        <button class="arr" type="button" id="next" data-i18n-label="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <section class="sec svc" id="servicios">
    <div class="wrap">
      <div class="sec-h"><h2 data-i18n="servH"></h2></div>
      <div class="sv-grid">
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10H4z"></path><path d="M10 20v-6h4v6"></path></svg><h3 data-i18n="s1"></h3><p data-i18n="s1d"></p></article>
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="10" cy="17" r="2.5"></circle></svg><h3 data-i18n="s2"></h3><p data-i18n="s2d"></p></article>
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="3.5"></circle><path d="M10.6 12.4L20 3M17 6l3 3M14.5 8.5l2 2"></path></svg><h3 data-i18n="s3"></h3><p data-i18n="s3d"></p></article>
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"></path><path d="M14 7l3 3"></path></svg><h3 data-i18n="s4"></h3><p data-i18n="s4d"></p></article>
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"></path><path d="M6 20V5h7v15"></path><path d="M13 20v-9h5v9"></path><path d="M9 9h1M9 13h1"></path></svg><h3 data-i18n="s5"></h3><p data-i18n="s5d"></p></article>
        <article class="sv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"></path><path d="M7 15l4-4 3 3 5-6"></path><path d="M15 8h4v4"></path></svg><h3 data-i18n="s6"></h3><p data-i18n="s6d"></p></article>
      </div>
    </div>
  </section>

  <section class="sec paper" id="proyectos">
    <div class="wrap">
      <div class="sec-h" style="display:block">
        <h2 data-i18n="extH"></h2>
        <p class="ex-sub" data-i18n="extSub"></p>
      </div>
      <div class="ex">
        <div class="ex-i" data-ext="0"></div>
        <div class="ex-i" data-ext="1"></div>
        <div class="ex-i" data-ext="2"></div>
        <div class="ex-i" data-ext="3"></div>
        <div class="ex-i" data-ext="4"></div>
        <div class="ex-i" data-ext="5"></div>
        <div class="ex-i" data-ext="6"></div>
        <div class="ex-i" data-ext="7"></div>
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="wrap cta-in">
      <div><h2 data-i18n="ctaH"></h2><p data-i18n="ctaP"></p></div>
      <a class="btn btn-gold" href="#contacto" data-i18n="ctaBtn"></a>
    </div>
  </section>

  <section class="sec" id="contacto">
    <div class="wrap ct-grid">
      <div>
        <h2 data-i18n="ctH"></h2>
        <p class="lead" data-i18n="ctP"></p>
        <div class="ct-data">
          <div><span data-i18n="phoneL"></span>+502 5555-5555</div>
          <div><span data-i18n="mailL"></span>info@armopa.com</div>
        </div>
      </div>
      <div class="frm" id="contactForm">
        <div class="fld"><label for="f-nombre" data-i18n="fName"></label><input id="f-nombre" type="text" autocomplete="name"></div>
        <div class="fld"><label for="f-correo" data-i18n="fMail"></label><input id="f-correo" type="email" autocomplete="email"></div>
        <div class="fld"><label for="f-tel" data-i18n="fPhone"></label><input id="f-tel" type="tel" autocomplete="tel"></div>
        <div class="fld"><label for="f-motivo" data-i18n="fReason"></label>
          <select id="f-motivo"><option data-i18n="r1"></option><option data-i18n="r2"></option><option data-i18n="r3"></option><option data-i18n="r4"></option></select>
        </div>
        <div class="fld full"><label for="f-msg" data-i18n="fMsg"></label><textarea id="f-msg" rows="4"></textarea></div>
        <button class="btn btn-gold" type="button" id="sendBtn" data-i18n="send"></button>
        <p class="note" id="sentNote" hidden data-i18n="sentMsg"></p>
      </div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <div class="ftr-grid">
      <img src="assets/logo.webp" alt="ARMOPA">
      <div><strong>ARMOPA</strong><span>Administración Inmobiliaria</span><span>Guatemala</span></div>
      <div><strong data-i18n="fAtt"></strong><span>+502 5555-5555</span><span>info@armopa.com</span></div>
      <div><strong data-i18n="fFollow"></strong><span>Facebook</span><span>Instagram</span><span>YouTube</span></div>
    </div>
    <div class="copy">© 2026 ARMOPA. <span data-i18n="rights"></span></div>
  </div>
</footer>

<div class="modal" id="clientModal" hidden>
  <button class="scrim" type="button" id="scrim" data-i18n-label="close"></button>
  <div class="mcard" role="dialog" aria-modal="true">
    <button class="mx" type="button" id="closeClient" data-i18n-label="close">×</button>
    <img src="assets/logo.webp" alt="ARMOPA">
    <h2 data-i18n="client"></h2>
    <div class="fld"><label for="c-user" data-i18n="cUser"></label><input id="c-user" type="text" autocomplete="username"></div>
    <div class="fld"><label for="c-pass" data-i18n="cPass"></label><input id="c-pass" type="password" autocomplete="current-password"></div>
    <div class="fld"><label for="c-code" data-i18n="cCode"></label><input id="c-code" type="text"></div>
    <button class="btn btn-gold" type="button" id="clientGo" data-i18n="cGo"></button>
    <p class="note" id="clientNote" hidden data-i18n="cMsg"></p>
  </div>
</div>

<script src="script.js?v=20260920c"></script>
</body>
</html>
